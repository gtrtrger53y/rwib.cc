<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seeker 3 — Savings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --border: #e4e3df;
    --text: #0f0f0d;
    --muted: #9e9d98;
    --progress: #0f0f0d;
    --funded: #2a6648;
    --funded-bg: #edf4f0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 20px 80px;
  }

  .container {
    width: 100%;
    max-width: 440px;
  }

  header { margin-bottom: 40px; }

  .label-small {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1 {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }

  h1 .dim { color: var(--muted); font-weight: 400; }

  .progress-section {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 28px;
    margin-bottom: 12px;
  }

  .amount-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .saved-num {
    font-size: 56px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
    transition: all 0.2s;
  }

  .goal-of {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    text-align: right;
    line-height: 1.5;
  }

  .goal-of span {
    display: block;
    font-size: 18px;
    color: var(--text);
    font-weight: 400;
  }

  .bar-track {
    width: 100%;
    height: 3px;
    background: var(--border);
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: var(--progress);
    width: 0%;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }

  .bar-meta {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
  }

  .bar-pct,
  .bar-remaining {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }

  .btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    padding: 18px 0;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, transform 0.1s;
    user-select: none;
  }

  .btn:active { transform: scale(0.98); }

  .btn-add {
    background: var(--text);
    border-color: var(--text);
    color: var(--bg);
  }

  .btn-add:hover { background: #2d2d2a; }
  .btn-sub:hover { background: #efede9; }

  .btn-sub:disabled {
    opacity: 0.28;
    cursor: not-allowed;
    transform: none;
  }

  .parts-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
    margin-top: 28px;
  }

  .part-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .part-item:first-of-type { border-top: 1px solid var(--border); }

  .part-indicator {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--border);
    flex-shrink: 0;
    transition: background 0.4s;
  }

  .part-indicator.funded { background: var(--funded); }

  .part-body { flex: 1; min-width: 0; }

  .part-name {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .part-name a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s;
  }

  .part-name a:hover { border-color: var(--text); }

  .part-desc {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
  }

  .part-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    flex-shrink: 0;
  }

  .part-cost {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
  }

  .part-tag {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 2px 7px;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    transition: all 0.3s;
  }

  .part-tag.funded {
    color: var(--funded);
    background: var(--funded-bg);
    border-color: transparent;
  }

  .done-bar {
    display: none;
    margin-top: 12px;
    background: var(--funded-bg);
    border: 1px solid #c4ddd4;
    padding: 16px 20px;
    animation: fadeUp 0.4s ease;
  }

  .done-bar.show { display: block; }

  .done-bar p {
    font-size: 13px;
    font-weight: 600;
    color: var(--funded);
    letter-spacing: -0.01em;
  }

  .done-sub {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: #5a9e82;
    margin-top: 2px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes bump {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  .bump { animation: bump 0.22s ease; }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="label-small">Build Goal</div>
    <h1>Deepspace<br><span class="dim">Seeker 3</span></h1>
  </header>

  <div class="progress-section">
    <div class="amount-row">
      <div class="saved-num" id="savedDisplay">$0</div>
      <div class="goal-of">
        Goal<br>
        <span>$765</span>
      </div>
    </div>
    <div class="bar-track">
      <div class="bar-fill" id="barFill"></div>
    </div>
    <div class="bar-meta">
      <div class="bar-pct" id="pctDisplay">0%</div>
      <div class="bar-remaining" id="remainDisplay">$765 remaining</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-add" onclick="adjust(10)">+ $10</button>
    <button class="btn btn-sub" id="subBtn" onclick="adjust(-10)" disabled>− $10</button>
  </div>

  <div class="parts-label">Parts</div>

  <div class="part-item">
    <div class="part-indicator" id="dot0"></div>
    <div class="part-body">
      <div class="part-name"><a href="https://shop.addictiverc.com/products/deepspace-seeker3-3-inch-freestyle-fpv-drone-dc-o4-pro-4s-with-elrs-gps" target="_blank">Deepspace Seeker 3</a></div>
      <div class="part-desc">AddictiveRC · 3" · DJI O4 Pro 4S · ELRS · GPS</div>
    </div>
    <div class="part-right">
      <div class="part-cost">$610</div>
      <div class="part-tag" id="tag0">Pending</div>
    </div>
  </div>

  <div class="part-item">
    <div class="part-indicator" id="dot1"></div>
    <div class="part-body">
      <div class="part-name"><a href="https://a.co/d/0azPFr6D" target="_blank">Battery Pack</a></div>
      <div class="part-desc">Amazon · 4S LiPo</div>
    </div>
    <div class="part-right">
      <div class="part-cost">$70</div>
      <div class="part-tag" id="tag1">Pending</div>
    </div>
  </div>

  <div class="part-item">
    <div class="part-indicator" id="dot2"></div>
    <div class="part-body">
      <div class="part-name"><a href="https://a.co/d/0e46KEzd" target="_blank">Barry Charger</a></div>
      <div class="part-desc">Amazon · LiPo Balance Charger</div>
    </div>
    <div class="part-right">
      <div class="part-cost">$85</div>
      <div class="part-tag" id="tag2">Pending</div>
    </div>
  </div>

  <div class="done-bar" id="doneBar">
    <p>Goal reached.</p>
    <div class="done-sub">Time to order.</div>
  </div>

</div>

<script>
  const GOAL = 765;
  const THRESHOLDS = [610, 680, 765];

  let saved = parseInt(localStorage.getItem('seeker3_saved') || '0', 10);

  function render() {
    saved = Math.max(0, Math.min(saved, GOAL));
    localStorage.setItem('seeker3_saved', saved);

    const pct = saved / GOAL;
    const remaining = GOAL - saved;

    document.getElementById('savedDisplay').textContent = '$' + saved;
    document.getElementById('pctDisplay').textContent = Math.round(pct * 100) + '%';
    document.getElementById('remainDisplay').textContent =
      remaining > 0 ? '$' + remaining + ' remaining' : 'Complete';
    document.getElementById('barFill').style.width = (pct * 100) + '%';
    document.getElementById('subBtn').disabled = saved <= 0;

    THRESHOLDS.forEach((t, i) => {
      const funded = saved >= t;
      document.getElementById('dot' + i).className = 'part-indicator' + (funded ? ' funded' : '');
      const tag = document.getElementById('tag' + i);
      tag.className = 'part-tag' + (funded ? ' funded' : '');
      tag.textContent = funded ? 'Funded' : 'Pending';
    });

    document.getElementById('doneBar').className = 'done-bar' + (saved >= GOAL ? ' show' : '');
  }

  function adjust(delta) {
    saved += delta;
    render();
    const el = document.getElementById('savedDisplay');
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }

  render();
</script>
</body>
</html>
