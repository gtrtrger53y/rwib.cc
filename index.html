<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c0c0c">
<title>rwib.cc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&family=Barlow+Condensed:wght@700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141414; --surface: #1c1c1c; --border: #2a2a2a; --text: #e2ddd4;
    --muted: #6a6a64; --accent: #c8b98a; --bad: #e0614c; --good: #8fe08a;
    --d: min(94vw, 76vh, 600px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0c0c0c; color: var(--text); font-family: 'Barlow', sans-serif; min-height: 100%; }
  body { -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  button { font: inherit; }

  /* ================= VAULT SCENE ================= */
  #scene {
    position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 45%, #2a2622 0%, #151413 45%, #080808 80%),
      #0c0c0c;
    transition: opacity .9s ease, transform 1.1s cubic-bezier(.5,0,.2,1);
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  #scene::before { /* concrete wall texture */
    content: ''; position: absolute; inset: 0; opacity: .5; pointer-events: none;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 2px, transparent 2px 6px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.25) 0 1px, transparent 1px 140px),
      repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 1px, transparent 1px 70px);
  }
  #scene::after { /* floor glow */
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 30vh; pointer-events: none;
    background: linear-gradient(to top, rgba(0,0,0,.7), transparent);
  }
  #scene.zoom { transform: scale(3.2); opacity: 0; }

  .title {
    position: absolute; top: 6vh; left: 0; right: 0; text-align: center; z-index: 3;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800; letter-spacing: .35em;
    font-size: clamp(14px, 2.4vw, 20px); color: var(--accent); text-transform: uppercase;
    opacity: 0; animation: fadeTitle 3.2s ease forwards;
  }
  .title small { display: block; font-family: 'DM Mono', monospace; font-weight: 400; letter-spacing: .25em; font-size: 10px; color: var(--muted); margin-top: 8px; }
  @keyframes fadeTitle { 0% { opacity: 0; transform: translateY(-8px); } 30%, 100% { opacity: 1; transform: none; } }

  .stage { perspective: 1800px; position: relative; z-index: 2; }
  #frame {
    position: relative; width: calc(var(--d) * 1.14); height: calc(var(--d) * 1.14); border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, #4a4844 0%, #2b2a28 40%, #191817 70%, #0e0e0d 100%);
    box-shadow:
      0 40px 80px rgba(0,0,0,.8), inset 0 0 0 2px #3b3a37, inset 0 0 calc(var(--d) * .05) rgba(0,0,0,.9),
      0 0 0 calc(var(--d) * .02) #1a1918, 0 0 0 calc(var(--d) * .024) #33322f;
    transform-style: preserve-3d;
    animation: approach 2.6s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes approach {
    0% { transform: translateZ(-2400px) translateY(4vh); opacity: 0; filter: brightness(.2); }
    35% { opacity: 1; }
    100% { transform: none; opacity: 1; filter: brightness(1); }
  }
  /* the opening behind the door */
  .opening {
    position: absolute; left: 50%; top: 50%; width: var(--d); height: var(--d); margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
    border-radius: 50%; overflow: hidden;
    background: radial-gradient(circle at 50% 55%, #fff4d6 0%, #e7c98a 18%, #8a6a35 45%, #24190c 75%, #0b0805 100%);
    box-shadow: inset 0 0 calc(var(--d) * .12) rgba(0,0,0,.95);
  }
  .opening::after { /* shelves inside */
    content: ''; position: absolute; inset: 18% 22%;
    background: repeating-linear-gradient(0deg, rgba(40,26,8,.55) 0 4px, transparent 4px 22%);
    filter: blur(1px); opacity: .7;
  }
  .hinge {
    position: absolute; left: calc(var(--d) * -0.005); width: calc(var(--d) * .09); height: calc(var(--d) * .14);
    background: linear-gradient(90deg, #1a1a19, #4b4a46 45%, #24231f); border-radius: 6px;
    box-shadow: 0 4px 10px rgba(0,0,0,.6), inset 0 0 0 1px #57554f; z-index: 1;
  }
  .hinge.h1 { top: 22%; } .hinge.h2 { bottom: 22%; }

  .door {
    position: absolute; left: 50%; top: 50%; width: var(--d); height: var(--d); margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
    transform-origin: 0% 50%; transform-style: preserve-3d;
    transition: transform 1.8s cubic-bezier(.65,.02,.3,1);
    z-index: 2;
  }
  .open .door { transform: rotateY(-112deg); }
  .face {
    position: absolute; inset: 0; border-radius: 50%;
    background:
      repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.025) 0 1px, transparent 1px 5px),
      radial-gradient(circle at 32% 28%, #8d8a83 0%, #5f5c56 28%, #3d3b37 60%, #262523 100%);
    box-shadow:
      inset 0 0 0 calc(var(--d) * .012) #2a2926, inset 0 0 0 calc(var(--d) * .02) #6d6a63,
      inset 0 calc(var(--d) * .01) calc(var(--d) * .03) rgba(255,255,255,.15),
      inset 0 calc(var(--d) * -.02) calc(var(--d) * .05) rgba(0,0,0,.6),
      0 10px 30px rgba(0,0,0,.7);
    z-index: 2;
  }
  .ring {
    position: absolute; border-radius: 50%; inset: 7%;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08);
  }
  .ring.r2 { inset: 10%; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
  .rivet {
    position: absolute; width: calc(var(--d) * .026); height: calc(var(--d) * .026); border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #d5d1c7, #6a675f 60%, #33312d);
    box-shadow: 0 1px 2px rgba(0,0,0,.7);
  }
  .plate {
    position: absolute; left: 50%; top: 6.5%; transform: translateX(-50%);
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800; letter-spacing: .3em;
    font-size: calc(var(--d) * .028); color: #2b2925; text-shadow: 0 1px 0 rgba(255,255,255,.18);
  }

  /* bolts */
  .arm { position: absolute; left: 50%; top: 50%; width: 0; height: 0; z-index: 1; }
  .bolt {
    position: absolute; width: calc(var(--d) * .06); height: calc(var(--d) * .11);
    left: calc(var(--d) * -.03); top: calc(var(--d) * -.545);
    border-radius: 4px;
    background: linear-gradient(90deg, #3c3a36, #c9c4b8 45%, #8a867c 60%, #3c3a36);
    box-shadow: 0 2px 4px rgba(0,0,0,.6);
    transition: transform .55s cubic-bezier(.5,0,.3,1);
  }
  .unlocked .bolt { transform: translateY(calc(var(--d) * .09)); }

  /* handle wheel */
  .wheel {
    position: absolute; left: 50%; top: 22%; width: calc(var(--d) * .27); height: calc(var(--d) * .27);
    margin: calc(var(--d) * -.135) 0 0 calc(var(--d) * -.135); z-index: 3;
    transition: transform 1.3s cubic-bezier(.5,0,.25,1);
    filter: drop-shadow(0 6px 6px rgba(0,0,0,.55));
  }
  .unlocked .wheel { transform: rotate(-450deg); }
  .spoke {
    position: absolute; left: 50%; top: 50%; width: 100%; height: calc(var(--d) * .024);
    margin: calc(var(--d) * -.012) 0 0 -50%; border-radius: 99px;
    background: linear-gradient(180deg, #e6e1d5, #9a958a 50%, #5a574f);
  }
  .spoke::before, .spoke::after {
    content: ''; position: absolute; top: 50%; width: calc(var(--d) * .045); height: calc(var(--d) * .045);
    margin-top: calc(var(--d) * -.0225); border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f1ecdf, #a29c90 55%, #4d4a43);
  }
  .spoke::before { left: calc(var(--d) * -.012); } .spoke::after { right: calc(var(--d) * -.012); }
  .hub {
    position: absolute; left: 50%; top: 50%; width: 38%; height: 38%; margin: -19% 0 0 -19%; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f3eee2, #b7b1a4 40%, #6b675e 80%);
    box-shadow: inset 0 0 0 calc(var(--d) * .006) #4e4b44, 0 2px 6px rgba(0,0,0,.5);
  }
  .hub::after { content: ''; position: absolute; inset: 32%; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #c8b98a, #6e623e); }

  /* keypad panel */
  .panel {
    position: absolute; left: 50%; top: 39%; width: 58%; height: 49%; transform: translateX(-50%);
    border-radius: calc(var(--d) * .03) calc(var(--d) * .03) calc(var(--d) * .09) calc(var(--d) * .09);
    background: linear-gradient(180deg, #2b2a27, #1b1a18);
    box-shadow: inset 0 0 0 calc(var(--d) * .004) #0d0d0c, 0 0 0 calc(var(--d) * .006) #77736a, 0 6px 14px rgba(0,0,0,.6);
    padding: 4.5% 6% 6%; display: flex; flex-direction: column; gap: 4%; z-index: 3;
  }
  .lcd {
    height: 23%; border-radius: calc(var(--d) * .012); background: #0a120a;
    box-shadow: inset 0 0 calc(var(--d) * .02) rgba(0,0,0,.9), 0 0 0 1px #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4%;
    font-family: 'DM Mono', monospace; color: var(--good); text-shadow: 0 0 6px rgba(143,224,138,.6);
    cursor: text; transition: color .2s, text-shadow .2s;
  }
  .lcd .l1 { font-size: calc(var(--d) * .024); letter-spacing: .18em; opacity: .85; }
  .lcd .l2 { font-size: calc(var(--d) * .04); letter-spacing: .3em; line-height: 1; }
  .lcd.bad { color: var(--bad); text-shadow: 0 0 8px rgba(224,97,76,.7); }
  .lcd.busy .l2 { animation: blink .7s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .keys { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); gap: calc(var(--d) * .012); }
  .key {
    border: 0; border-radius: calc(var(--d) * .012); cursor: pointer; color: #1d1c1a;
    font-family: 'DM Mono', monospace; font-weight: 500; font-size: calc(var(--d) * .036);
    background: linear-gradient(180deg, #e9e4d8, #a9a497);
    box-shadow: 0 calc(var(--d) * .006) 0 #55524b, 0 calc(var(--d) * .008) calc(var(--d) * .01) rgba(0,0,0,.5);
    transition: transform .06s, box-shadow .06s;
  }
  .key.fn { font-size: calc(var(--d) * .022); letter-spacing: .08em; background: linear-gradient(180deg, #8d887d, #5d5a52); color: #f0ebdf; }
  .key.ok { background: linear-gradient(180deg, #d9c88f, #9b8a52); }
  .key:active, .key.pressed { transform: translateY(calc(var(--d) * .005)); box-shadow: 0 calc(var(--d) * .001) 0 #55524b; }
  .shake { animation: shake .45s; }
  @keyframes shake { 15%,55% { transform: translateX(-10px); } 35%,75% { transform: translateX(10px); } }
  .glow { position: absolute; inset: -20%; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity 1.6s ease;
    background: radial-gradient(circle, rgba(255,226,160,.35), transparent 60%); z-index: 0; }
  .open .glow { opacity: 1; }
  .hint { position: absolute; bottom: 4.5vh; left: 0; right: 0; text-align: center; z-index: 3;
    font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase;
    opacity: 0; animation: fadeTitle 3.6s ease .4s forwards; }
  #kb { position: absolute; opacity: 0; width: 1px; height: 1px; left: -100px; }

  @media (prefers-reduced-motion: reduce) {
    #frame { animation-duration: .6s; } .door { transition-duration: .7s; } .wheel { transition-duration: .5s; }
  }

  /* ================= HUB ================= */
  #hub { display: none; background: var(--bg); min-height: 100vh; opacity: 0; transition: opacity .7s ease; }
  #hub.show { opacity: 1; }
  .wrap { max-width: 620px; margin: 0 auto; padding: 44px 18px 70px; }
  .eyebrow { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 46px; line-height: .95; text-transform: uppercase; margin-top: 8px; }
  h1 span { color: var(--muted); display: block; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .lock { background: none; border: 1px solid var(--border); color: var(--muted); font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 8px 10px; cursor: pointer; }
  .lock:hover { color: var(--text); border-color: var(--muted); }
  section { margin-top: 36px; }
  .sh { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .sh .note { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); }
  .list { border: 1px solid var(--border); background: var(--surface); }
  .item { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; border: 0; border-bottom: 1px solid var(--border); background: none; color: var(--text); text-align: left; cursor: pointer; text-decoration: none; }
  .item:last-child { border-bottom: 0; }
  .item:hover { background: #222; }
  .ic { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border: 1px solid var(--border); font-size: 16px; }
  .tx { flex: 1; min-width: 0; }
  .t { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; }
  .d { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .k { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); padding: 3px 6px; flex: none; }
  .proj { border: 1px solid var(--border); background: var(--surface); margin-bottom: 8px; }
  .proj > .item { border-bottom: 0; }
  .proj .chev { color: var(--muted); font-family: 'DM Mono', monospace; transition: transform .2s; flex: none; }
  .proj.open .chev { transform: rotate(90deg); }
  .files { display: none; border-top: 1px solid var(--border); background: #181818; }
  .proj.open .files { display: block; }
  .files .item { padding: 10px 16px 10px 30px; gap: 10px; }
  .files .ic { width: 26px; height: 26px; font-size: 12px; }
  .files .t { font-weight: 600; font-size: 13px; font-family: 'DM Mono', monospace; white-space: nowrap; }
  .files .msg { padding: 12px 30px; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }
  .files .msg a { color: var(--accent); }
  .tag { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); border: 1px solid #3a352a; padding: 2px 5px; margin-left: 6px; vertical-align: 2px; }
  .foot { margin-top: 40px; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); text-align: center; }

  #viewer { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 10; flex-direction: column; }
  #viewer.open { display: flex; }
  #viewer .bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
  #viewer .bar button { background: none; border: 1px solid var(--border); color: var(--text); font-family: 'DM Mono', monospace; font-size: 12px; padding: 7px 10px; cursor: pointer; flex: none; }
  #viewer .bar .vt { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  #viewer iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  #viewer .bar a, #viewer .bar .vb { background: none; border: 1px solid var(--border); color: var(--text); font-family: 'DM Mono', monospace; font-size: 12px; padding: 7px 10px; cursor: pointer; flex: none; text-decoration: none; }
  #viewer .bar a.save { border-color: var(--accent); color: var(--accent); }
  #fileCard { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 30px 20px; text-align: center; }
  #fileCard .big { font-size: 46px; }
  #fileCard .fn { font-family: 'DM Mono', monospace; font-size: 14px; word-break: break-all; }
  #fileCard .sz { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }
  #fileCard a, #fileCard button { display: block; width: 100%; max-width: 320px; padding: 15px; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; border: 1px solid var(--accent); color: #141414; background: var(--accent); cursor: pointer; }
  #fileCard button { background: none; color: var(--text); border-color: var(--border); }
  .about { padding: 14px 30px 4px; font-size: 13px; line-height: 1.55; color: #cfc9be; }
  .sub { padding: 10px 30px 4px; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .files .proj { margin: 6px 12px 6px 22px; }
  .files .proj .files .item { padding-left: 22px; }
</style>
</head>
<body>

<div id="scene">
  <div class="title">rwib.cc<small>restricted</small></div>
  <div class="stage">
    <div id="frame">
      <div class="glow"></div>
      <div class="opening"></div>
      <div class="hinge h1"></div><div class="hinge h2"></div>
      <div class="door" id="door">
        <div id="bolts"></div>
        <div class="face" id="face">
          <div class="ring"></div><div class="ring r2"></div>
          <div class="wheel"><div class="spoke"></div><div class="spoke" style="transform:rotate(60deg)"></div><div class="spoke" style="transform:rotate(120deg)"></div><div class="hub"></div></div>
          <div class="panel" id="panel">
            <div class="lcd" id="lcd"><div class="l1" id="l1">CODE 1 / 3</div><div class="l2" id="l2">○○○○○○</div></div>
            <div class="keys" id="keys"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="hint">enter the codes on the door</div>
  <input id="kb" type="tel" inputmode="numeric" autocomplete="off" aria-label="Code">
</div>

<div id="hub">
  <div class="wrap">
    <div class="top">
      <div>
        <div class="eyebrow">rwib.cc / vault</div>
        <h1>Shua's<span>Stuff</span></h1>
      </div>
      <button class="lock" id="lockBtn" type="button">Lock</button>
    </div>
    <div id="sections"></div>
    <div class="foot">rwib.cc</div>
  </div>
</div>

<div id="viewer">
  <div class="bar">
    <button id="back" type="button">← Back</button>
    <div class="vt" id="vt"></div>
    <button id="share" class="vb" type="button" style="display:none">Share</button>
    <a id="openFull" target="_blank" rel="noopener" style="display:none">Open</a>
    <a id="dl" class="save" style="display:none">Save</a>
  </div>
  <iframe id="frame2" title="Viewer"></iframe>
  <div id="fileCard">
    <div class="big" id="fcIc">📄</div>
    <div class="fn" id="fcName"></div>
    <div class="sz" id="fcSize"></div>
    <a id="fcSave">Save file</a>
    <button id="fcShare" type="button" style="display:none">Share / Save to Files</button>
  </div>
</div>

<script>
(() => {
  // Everything behind the door is encrypted (AES-GCM). The key comes from all
  // three codes together, so nothing can be read without the full set.

  }
  async function decrypt(bytes) {
    return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(0, 12) }, key, bytes.slice(12)));
  }
  async function loadItem(id) {
    const r = await fetch('/vault/d/' + id + '.bin', { cache: 'no-cache' });
    if (!r.ok) throw new Error('missing ' + id);
    return decrypt(new Uint8Array(await r.arrayBuffer()));
  }

  // ---------- keypad ----------
  function render(l1, l2, cls) {
    $('l1').textContent = l1;
    $('l2').textContent = l2 != null ? l2 : '●'.repeat(cur.length) + '○'.repeat(LENS[step] - cur.length);
    $('lcd').className = 'lcd' + (cls ? ' ' + cls : '');
  }
  function idle() { render('CODE ' + (step + 1) + ' / 3'); }
  function flashKey(k) {
    const b = keysEl.querySelector(`[data-k="${k}"]`); if (!b) return;
    b.classList.add('pressed'); setTimeout(() => b.classList.remove('pressed'), 110);
  }
  function press(k) {
    if (busy) return;
    flashKey(k);
    if (k === 'CLR') { cur = ''; idle(); return; }
    if (k === 'OK') { if (cur.length) commit(); return; }
    if (cur.length >= LENS[step]) return;
    cur += k; idle();
    if (cur.length === LENS[step]) setTimeout(commit, 180);
  }
  async function commit() {
    if (busy) return;
    codes[step] = cur; cur = '';
    if (step < 2) { step++; render('CODE ' + step + ' OK', '✓'); busy = true; await sleep(450); busy = false; idle(); return; }
    busy = true; render('VERIFYING', '· · ·', 'busy');
    try {
      key = await deriveKey(codes.join('-'));
      manifest = JSON.parse(dec.decode(await decrypt(b64(MANIFEST))));
      const raw = await crypto.subtle.exportKey('raw', key);
      sessionStorage.setItem(KEY_STORE, btoa(String.fromCharCode(...new Uint8Array(raw))));
      await openDoor();
    } catch (e) {
      key = null; step = 0; codes = [];
      render('ACCESS DENIED', '✕', 'bad');
      const f = $('frame'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
      await sleep(1300); busy = false; idle();
    }
  }
  document.addEventListener('keydown', e => {
    if ($('scene').style.display === 'none') return;
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace' || e.key === 'Escape') press('CLR');
    else if (e.key === 'Enter') press('OK');
  });
  $('lcd').addEventListener('click', () => $('kb').focus());
  $('kb').addEventListener('input', e => { const v = e.target.value.replace(/\D/g, ''); e.target.value = ''; for (const c of v) press(c); });

  async function openDoor() {
    const sc = $('scene');
    render('ACCESS GRANTED', 'OPEN');
    await sleep(reduce ? 150 : 500);
    sc.classList.add('unlocked');           // bolts retract, wheel spins
    await sleep(reduce ? 400 : 1300);
    sc.classList.add('open');               // door swings
    await sleep(reduce ? 600 : 1500);
    sc.classList.add('zoom');               // fly through
    await sleep(reduce ? 300 : 900);
    showHub();
  }

  // ---------- hub ----------
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function showHub() {
    $('scene').style.display = 'none';
    const hub = $('hub'); hub.style.display = 'block';
    requestAnimationFrame(() => hub.classList.add('show'));
    buildHub();
  }
  function row(it, small) {
    const isLink = it.type === 'link';
    const r = isLink ? el('a', 'item') : el('button', 'item');
    if (isLink) { r.href = it.url; if (/^https?:/.test(it.url)) { r.target = '_blank'; r.rel = 'noopener'; } }
    else { r.type = 'button'; r.addEventListener('click', () => openItem(it, r)); }
    r.appendChild(el('div', 'ic', it.icon || (small ? fileIcon(it.title) : '•')));
    const tx = el('div', 'tx'); tx.appendChild(el('div', 't', it.title)); if (it.desc) tx.appendChild(el('div', 'd', it.desc));
    r.appendChild(tx);
    const label = it.label || (it.type === 'page' ? 'Open' : it.type === 'file' ? (it.view ? 'View' : 'Get') : /claude\.ai/.test(it.url || '') ? 'Claude' : /github\.com/.test(it.url || '') ? 'GitHub' : 'Link');
    r.appendChild(el('div', 'k', label));
    return r;
  }
  function fileIcon(name) {
    const ext = (name.split('.').pop() || '').toLowerCase();
    return ({ zip: '🗜', webp: '🖼', csv: '📊', png: '🖼', jpg: '🖼', jpeg: '🖼', gif: '🖼', svg: '🖼', stl: '🧊', '3mf': '🧊', step: '🧊', md: '📝', txt: '📝', pdf: '📕', html: '🌐', css: '🎨', js: '📜', ts: '📜', py: '🐍', ino: '🔌', c: '⚙', h: '⚙', cpp: '⚙', json: '🔧', yml: '🔧', yaml: '🔧', toml: '🔧', jsonc: '🔧', kicad_pcb: '🟩', kicad_sch: '🟩' })[ext] || '📄';
  }
  function project(p) {
    const box = el('div', 'proj');
    const head = el('button', 'item'); head.type = 'button';
    head.appendChild(el('div', 'ic', p.icon || '📁'));
    const tx = el('div', 'tx'); const t = el('div', 't', p.title);
    if (p.tag) t.appendChild(el('span', 'tag', p.tag));
    tx.appendChild(t); if (p.desc) tx.appendChild(el('div', 'd', p.desc));
    head.appendChild(tx);
    const label = p.label || (p.count == null ? 'Files' : p.count === 0 ? 'Notes' : p.count + (p.count === 1 ? ' file' : ' files'));
    head.appendChild(el('div', 'k', label));
    head.appendChild(el('div', 'chev', '›'));
    const files = el('div', 'files');
    let loaded = false;
    head.addEventListener('click', async () => {
      box.classList.toggle('open');
      if (!loaded && box.classList.contains('open')) { loaded = true; await p.fill(files); }
    });
    box.appendChild(head); box.appendChild(files);
    return box;
  }
  function fillProject(p, f) {
    if (p.about) f.appendChild(el('div', 'about', p.about));
    p.items.forEach(it => f.appendChild(row(it, true)));
    for (const name of (p.repos || [])) {
      f.appendChild(el('div', 'sub', 'GitHub: ' + name));
      const holder = el('div'); f.appendChild(holder);
      repoByName(name).then(r => r ? repoFiles(r, holder) : holder.appendChild(row({ type: 'link', url: `https://github.com/${GH_USER}/${name}`, icon: '↗', title: 'Open on GitHub', label: 'GitHub' }, true)));
    }
    if (!p.items.length && !(p.repos || []).length) f.appendChild(el('div', 'msg', 'No files saved yet.'));
  }
  let GH_USER = 'gtrtrger53y';
  const claimed = new Set();
  function buildHub() {
    const root = $('sections'); root.innerHTML = '';
    for (const sec of manifest.sections) for (const p of (sec.projects || [])) for (const r of (p.repos || [])) claimed.add(r.toLowerCase());
    for (const sec of manifest.sections) {
      const s = el('section'); const sh = el('div', 'sh');
      sh.appendChild(el('div', 'eyebrow', sec.title)); if (sec.note) sh.appendChild(el('div', 'note', sec.note));
      s.appendChild(sh);
      if (sec.kind === 'projects') {
        for (const p of sec.projects) {
          const cnt = p.items.length + (p.repos || []).length;
          s.appendChild(project({ ...p, count: p.repos && p.repos.length ? null : cnt, label: p.repos && p.repos.length ? (p.items.length ? 'Files + GitHub' : 'GitHub') : null, fill: f => fillProject(p, f) }));
        }
      } else if (sec.kind === 'github') {
        GH_USER = sec.user;
        s.appendChild(project({ icon: '🗂', title: sec.dropTitle || 'Other GitHub stuff', desc: 'Small repos and tests. New repos show up here by themselves.', label: 'Open', fill: f => githubMisc(sec.user, f) }));
      } else {
        const list = el('div', 'list'); sec.items.forEach(it => list.appendChild(row(it))); s.appendChild(list);
      }
      root.appendChild(s);
    }
  }

  // GitHub loads live, so new repos and files show up by themselves.
  async function gh(url) {
    const ck = 'gh:' + url, hit = sessionStorage.getItem(ck);
    if (hit) { const o = JSON.parse(hit); if (Date.now() - o.t < 10 * 60e3) return o.v; }
    const r = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) throw new Error('GitHub ' + r.status);
    const v = await r.json(); try { sessionStorage.setItem(ck, JSON.stringify({ t: Date.now(), v })); } catch (e) {}
    return v;
  }
  let reposP = null;
  function allRepos() {
    if (!reposP) reposP = gh(`https://api.github.com/users/${GH_USER}/repos?per_page=100&sort=pushed`)
      .then(a => a.sort((x, y) => new Date(y.pushed_at) - new Date(x.pushed_at))).catch(e => { reposP = null; throw e; });
    return reposP;
  }
  async function repoByName(name) {
    try { return (await allRepos()).find(r => r.name.toLowerCase() === name.toLowerCase()) || null; } catch (e) { return null; }
  }
  async function githubMisc(user, holder) {
    const m = el('div', 'msg', 'Loading…'); holder.appendChild(m);
    try {
      const repos = (await allRepos()).filter(r => !claimed.has(r.name.toLowerCase()));
      m.remove();
      if (!repos.length) { holder.appendChild(el('div', 'msg', 'Nothing else right now.')); return; }
      for (const r of repos) {
        const when = new Date(r.pushed_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        holder.appendChild(project({
          icon: '⌨️', title: r.name, tag: r.fork ? 'fork' : null, label: 'Files',
          desc: (r.description ? r.description + ' · ' : '') + (r.language ? r.language + ' · ' : '') + when,
          fill: f => repoFiles(r, f)
        }));
      }
    } catch (e) {
      m.innerHTML = 'GitHub is busy right now. <a target="_blank" rel="noopener"></a>';
      m.querySelector('a').href = 'https://github.com/' + user; m.querySelector('a').textContent = 'Open my GitHub';
    }
  }
  async function repoFiles(r, f) {
    const base = `https://github.com/${r.full_name}`;
    if (r.description) f.appendChild(el('div', 'about', r.description));
    f.appendChild(row({ type: 'link', url: base, icon: '↗', title: 'Open on GitHub', label: 'GitHub' }, true));
    f.appendChild(row({ type: 'link', url: `${base}/archive/refs/heads/${r.default_branch}.zip`, icon: '🗜', title: 'Download everything (zip)', label: 'Zip' }, true));
    const m = el('div', 'msg', 'Loading files…'); f.appendChild(m);
    try {
      const tree = await gh(`https://api.github.com/repos/${r.full_name}/git/trees/${encodeURIComponent(r.default_branch)}?recursive=1`);
      const blobs = (tree.tree || []).filter(x => x.type === 'blob');
      m.remove();
      if (!blobs.length) { f.appendChild(el('div', 'msg', 'No files yet.')); return; }
      blobs.slice(0, 150).forEach(b => f.appendChild(row({
        type: 'link', url: `${base}/blob/${r.default_branch}/${b.path.split('/').map(encodeURIComponent).join('/')}`,
        title: b.path, label: 'View'
      }, true)));
      if (blobs.length > 150 || tree.truncated) {
        const more = el('div', 'msg'); more.innerHTML = '<a target="_blank" rel="noopener"></a>';
        more.querySelector('a').href = base; more.querySelector('a').textContent = `See all ${blobs.length}${tree.truncated ? '+' : ''} files on GitHub`;
        f.appendChild(more);
      }
    } catch (e) { m.textContent = 'Could not load the file list. Use Open on GitHub.'; }
  }

  // ---------- viewer ----------
  // Files are decrypted first, then shown with a real Save link the user taps,
  // so phones treat it as a normal download.
  let urls = [], shareFile = null;
  function esc(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]); }
  function mkUrl(blob) { const u = URL.createObjectURL(blob); urls.push(u); return u; }
  function size(n) { return n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(0) + ' KB' : (n / 1048576).toFixed(1) + ' MB'; }
  function canShare(file) { try { return !!(navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) { return false; } }
  async function doShare() { if (!shareFile) return; try { await navigator.share({ files: [shareFile], title: shareFile.name }); } catch (e) {} }
  async function openItem(it, r) {
    const tag = r.querySelector('.k'), old = tag.textContent; tag.textContent = '…';
    try {
      const bytes = await loadItem(it.id);
      urls.forEach(u => URL.revokeObjectURL(u)); urls = []; shareFile = null;
      const dl = $('dl'), sh = $('share'), of = $('openFull'), fc = $('fileCard'), fr = $('frame2');
      dl.style.display = sh.style.display = of.style.display = 'none'; fc.style.display = 'none'; fr.style.display = '';
      fr.removeAttribute('src'); fr.srcdoc = '';
      if (it.type === 'page') {
        fr.srcdoc = dec.decode(bytes);
      } else {
        const name = it.filename;
        dl.href = mkUrl(new Blob([bytes], { type: 'application/octet-stream' })); dl.download = name; dl.style.display = '';
        const file = new File([bytes], name, { type: (it.mime || 'application/octet-stream').split(';')[0] });
        if (canShare(file)) { shareFile = file; sh.style.display = ''; }
        if (it.view === 'image') {
          const u = mkUrl(new Blob([bytes], { type: it.mime }));
          fr.srcdoc = `<body style="margin:0;background:#111;display:grid;place-items:center;min-height:100vh"><img src="${u}" style="max-width:100%;max-height:100vh"></body>`;
        } else if (it.view === 'text') {
          fr.srcdoc = `<body style="margin:0;background:#141414;color:#e2ddd4"><pre style="margin:0;padding:18px;font:13px/1.55 'DM Mono',ui-monospace,monospace;white-space:pre-wrap;word-break:break-word">${esc(dec.decode(bytes))}</pre></body>`;
        } else if (it.view === 'pdf') {
          const u = mkUrl(new Blob([bytes], { type: 'application/pdf' }));
          fr.src = u; of.href = u; of.style.display = '';
        } else {
          fr.style.display = 'none'; fc.style.display = 'flex';
          $('fcIc').textContent = fileIcon(name); $('fcName').textContent = name; $('fcSize').textContent = size(bytes.byteLength);
          $('fcSave').href = dl.href; $('fcSave').download = name;
          $('fcShare').style.display = shareFile ? '' : 'none';
        }
      }
      $('vt').textContent = it.title;
      $('viewer').classList.add('open');
      history.pushState({ v: 1 }, '');
    } catch (e) { alert('Could not open that one. Try again.'); }
    finally { tag.textContent = old; }
  }
  $('share').addEventListener('click', doShare);
  $('fcShare').addEventListener('click', doShare);
  function closeViewer() { $('viewer').classList.remove('open'); $('frame2').srcdoc = ''; $('frame2').removeAttribute('src'); urls.forEach(u => URL.revokeObjectURL(u)); urls = []; }
  $('back').addEventListener('click', () => { if (history.state && history.state.v) history.back(); else closeViewer(); });
  window.addEventListener('popstate', closeViewer);
  $('lockBtn').addEventListener('click', () => { sessionStorage.removeItem(KEY_STORE); location.reload(); });

  // ---------- start ----------
  (async () => {
    const saved = sessionStorage.getItem(KEY_STORE);
    if (saved) {
      try {
        key = await crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', false, ['decrypt']);
        manifest = JSON.parse(dec.decode(await decrypt(b64(MANIFEST))));
        showHub(); return;
      } catch (e) { sessionStorage.removeItem(KEY_STORE); key = null; }
    }
    idle();
    await sleep(reduce ? 500 : 2500);
    busy = false;
  })();
})();
</script>
</body>
</html>
