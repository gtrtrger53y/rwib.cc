; PlatformIO project for the "Cheap Yellow Display" (CYD / Sunton ESP32-2432S028R)
; 2.8" ILI9341 320x240 TFT + XPT2046 resistive touch, ESP32-WROOM-32.

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.1.0
    h2zero/NimBLE-Arduino@^1.4.2

build_flags =
    -DLGFX_USE_V1=1
    -DCORE_DEBUG_LEVEL=1
