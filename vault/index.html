<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&family=Barlow+Condensed:wght@700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141414;
    --surface: #1c1c1c;
    --border: #2a2a2a;
    --text: #e2ddd4;
    --muted: #6a6a64;
    --accent: #c8b98a;
    --bad: #d9614c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; min-height: 100%; }
  body { -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 48px 20px 64px; }
  .eyebrow { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 44px; line-height: .95; text-transform: uppercase; margin-top: 8px; }
  h1 span { color: var(--muted); display: block; }

  /* gate */
  #gate { min-height: 100vh; display: flex; align-items: center; }
  #gate .wrap { width: 100%; }
  .card { background: var(--surface); border: 1px solid var(--border); border-top: 2px solid var(--accent); padding: 28px 24px; margin-top: 28px; }
  .steps { display: flex; gap: 8px; margin-bottom: 22px; }
  .steps i { flex: 1; height: 4px; background: var(--border); transition: background .2s; }
  .steps i.on { background: var(--accent); }
  .label { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 12px; }
  .code { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-family: 'DM Mono', monospace; font-size: 30px; letter-spacing: .45em; text-align: center; padding: 14px 8px; outline: none; border-radius: 0; }
  .code:focus { border-color: var(--accent); }
  .btn { display: block; width: 100%; margin-top: 14px; background: var(--text); color: var(--bg); border: 0; font-family: 'Barlow', sans-serif; font-weight: 700; font-size: 15px; padding: 14px; cursor: pointer; letter-spacing: .02em; }
  .btn:disabled { opacity: .45; cursor: default; }
  .msg { min-height: 20px; margin-top: 14px; font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); text-align: center; }
  .msg.bad { color: var(--bad); }
  .shake { animation: shake .35s; }
  @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

  /* hub */
  #hub { display: none; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .lock { background: none; border: 1px solid var(--border); color: var(--muted); font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 8px 10px; cursor: pointer; }
  .lock:hover { color: var(--text); border-color: var(--muted); }
  section { margin-top: 36px; }
  section > .eyebrow { margin-bottom: 10px; }
  .list { border: 1px solid var(--border); background: var(--surface); }
  .item { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px 18px; border: 0; border-bottom: 1px solid var(--border); background: none; color: var(--text); text-align: left; cursor: pointer; text-decoration: none; font: inherit; }
  .item:last-child { border-bottom: 0; }
  .item:hover { background: #222; }
  .item .ic { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border: 1px solid var(--border); font-size: 16px; }
  .item .tx { flex: 1; min-width: 0; }
  .item .t { font-weight: 700; font-size: 15px; }
  .item .d { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 3px; }
  .item .k { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); padding: 3px 6px; flex: none; }
  .foot { margin-top: 40px; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); text-align: center; }
  .foot a { color: var(--muted); }

  /* viewer */
  #viewer { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 10; flex-direction: column; }
  #viewer.open { display: flex; }
  #viewer .bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface); }
  #viewer .bar button { background: none; border: 1px solid var(--border); color: var(--text); font-family: 'DM Mono', monospace; font-size: 12px; padding: 7px 10px; cursor: pointer; }
  #viewer .bar .vt { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #viewer iframe { flex: 1; width: 100%; border: 0; background: #fff; }
</style>
</head>
<body>

<div id="gate">
  <div class="wrap">
    <div class="eyebrow">rwib.cc</div>
    <h1>The<span>Vault</span></h1>
    <div class="card" id="card">
      <div class="steps"><i class="on"></i><i></i><i></i></div>
      <div class="label" id="label">Code 1 of 3</div>
      <form id="form" autocomplete="off">
        <input id="code" class="code" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Passcode">
        <button class="btn" id="go" type="submit">Next</button>
      </form>
      <div class="msg" id="msg"></div>
    </div>
  </div>
</div>

<div id="hub">
  <div class="wrap">
    <div class="top">
      <div>
        <div class="eyebrow">rwib.cc / vault</div>
        <h1>Shua's<span>Stuff</span></h1>
      </div>
      <button class="lock" id="lockBtn" type="button">Lock</button>
    </div>
    <div id="sections"></div>
    <div class="foot"><a href="/">← rwib.cc</a></div>
  </div>
</div>

<div id="viewer">
  <div class="bar">
    <button id="back" type="button">← Back</button>
    <div class="vt" id="vt"></div>
  </div>
  <iframe id="frame" title="Viewer"></iframe>
</div>

<script>
(() => {
  // Everything in this vault is encrypted (AES-GCM). The key comes from all
  // three codes together, so nothing can be read without the full set.
  const SALT = 'v70i1Y53WY8NUXAkgK/h4Q==';
  const ITER = 310000;
  const MANIFEST = 'K1o6fkLfHCGOibYdcWpduLCkNfwsWSsDK8m9II82ixWo1fjgJaA4bgXu8nLOD291ncBJdXwVd7V4Hj1II79SxagOs/IY/61mBPJ7F6F3Ee0Knx218CK0UAMxvK5r3wAd74fMWIO7C468+C0Fu9OGA+WKRZO6uLKnN3AeRj2VcnDjlQIr4EyyQjcS8Wo08RiV+RB0DexZAY+cP3y+vUE3wpzHBUhdf40VBcLr6V6+qbVn1iWYwmDt4uvqthITCRd6RjIALWqTUkpCKF2r691Tmi0oBYlwHGgAnoIOQquBGaezut4UPTPtHIN3LOPOOre7Rj98YCr08ykwb5PTJqJDha/GMJQgKO0TCNn8L+bDNxU43IysH+MDkavDkyHmiXwTb5XuHyGfPLMl/FuXEFQ9T6PGH53/ubO+ULusrRdgKvjm5VhNl4OkgosfaGnARIwpaOzTcQlIQKxs4DkcIttq+EYdbkKvACzHxg0ibXgK+As7zXOYxr/89qG/7YA1IdanDgK2PS+mVSGzUSNYzLgd4YXk8WDkEKbXmfVW7CqzzA0wS53MuuR90ikfzlPZ1WlKV49IlCOr+ubkprnLdBSE3j8UqpgergZbdDB4n/mUpu8DrxsWptUhCbhGx1Tmp8hEO+g7FhGdhIssLfpx/T+aS4WkbnkFiHKRj0E4y1AsaUU6OMDGT08ZYvVTwdJGdiAu2JKVK3ylW7bXkb3ZigYn3EB6ghiQkdz0bD+CTGj9iq0degkPiCaMXTvOuk+Hw39KVaFUg/Drp+aSUybChLyTMGSKG+LDxb5MN/xbn2xK7NE3u6BZWC72gtXjy1V/C7UrQJR3Nx31NmhBDvzJ4KDSDSqQmKRYK3M9d29fEIpUraZhzx2F5t9746PijMha0zb6Vxngk7whrHLwY0C6YxhdMnEMcKpfJ2Y7Kybwc2LYiZGBiCF1tHD8LEQIBmZf16Y9jMwpNXFaf5zJsn8IE+a5LjjTwcgadCAzM5QMfJiLMLwWs2L7FDVQ/AJamxin2QtIpUDJqXG6+mZymHCRZNELgfj5k9gEeZCtCSp6tzKF8kpX0RpwLP6LKTK7M1WA/kbQNh52Y6g6M0Cn8jpfdy9BEG0Jg2ly2T1jXrQmwvNIdzI8q9nKQp3iPxsco2iG3KGsVGsW/GfQh2qA6CPKU/H1Bt8upFIddYtYjLLbzqLonA/ob/cqkU2v5VsUkIpAckh8DzL4t2f0RXsGqIW6UuF65SaiBYcjEouD8FgPKgRpzVCK4+swGCz+HV8PTseiQhpNNs+kqSd3BE3ysqj2gsk+kbqDtUTs4Kx/vGFY6DcCOMzYgA6W+5F8d48xMvCKxXWB1mT6FSCCg2xpyy6GcFp6TKod9yuG/n5CrmCGJjj/NH6jnLfROsAxcwwLffQ8TXG4cSP7Pj3N5fei4kzk4QxCnyRdWtVCNOJB5m/DM0fEi654t2BX930KTi+xMNoDDX6YKBZhxMKZbvppOe9eWMj4pIvi1fumvImaG6bVKbSnRGCBqFNMyoq5nUmCvONF2CnrvjNuMXczzGHbYElHyY4FfkZetmNNH8lV/00n+QZgwVmDYe/dG0tN59PCcrZBVVOYAFFrnJD8quWGMqNB4zNU71meBiE1TMuN/IHkerIWQ8wK4fcO5jI4w/Qg';
  const LENS = [6, 4, 4];
  const KEY_STORE = 'rwib-vault-key';

  const $ = id => document.getElementById(id);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const enc = new TextEncoder(), dec = new TextDecoder();

  let step = 0, codes = [], key = null, manifest = null;

  async function deriveKey(pass) {
    const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function decrypt(bytes) {
    const iv = bytes.slice(0, 12), data = bytes.slice(12);
    return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data));
  }
  async function loadItem(id) {
    const r = await fetch('d/' + id + '.bin', { cache: 'no-cache' });
    if (!r.ok) throw new Error('missing ' + id);
    return decrypt(new Uint8Array(await r.arrayBuffer()));
  }

  // ---- gate ----
  function showStep() {
    document.querySelectorAll('.steps i').forEach((el, i) => el.classList.toggle('on', i <= step));
    $('label').textContent = 'Code ' + (step + 1) + ' of 3';
    $('go').textContent = step < 2 ? 'Next' : 'Unlock';
    $('code').value = '';
    $('code').maxLength = LENS[step];
    $('code').focus();
  }
  function fail(text) {
    step = 0; codes = [];
    $('msg').textContent = text; $('msg').className = 'msg bad';
    const c = $('card'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
    showStep();
  }
  async function submit() {
    const v = $('code').value.trim();
    if (!/^\d+$/.test(v)) return;
    codes[step] = v;
    $('msg').textContent = ''; $('msg').className = 'msg';
    if (step < 2) { step++; showStep(); return; }
    $('go').disabled = true; $('msg').textContent = 'Unlocking…';
    try {
      key = await deriveKey(codes.join('-'));
      manifest = JSON.parse(dec.decode(await decrypt(b64(MANIFEST))));
      const raw = await crypto.subtle.exportKey('raw', key);
      sessionStorage.setItem(KEY_STORE, btoa(String.fromCharCode(...new Uint8Array(raw))));
      openHub();
    } catch (e) {
      key = null;
      fail('Wrong code. Start again from code 1.');
    } finally {
      $('go').disabled = false;
    }
  }
  $('form').addEventListener('submit', e => { e.preventDefault(); submit(); });
  $('code').addEventListener('input', () => {
    const el = $('code');
    el.value = el.value.replace(/\D/g, '');
    if (el.value.length >= LENS[step]) submit();
  });

  // ---- hub ----
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
  function openHub() {
    $('gate').style.display = 'none';
    $('hub').style.display = 'block';
    const root = $('sections'); root.innerHTML = '';
    for (const sec of manifest.sections) {
      const s = el('section');
      s.appendChild(el('div', 'eyebrow', sec.title));
      const list = el('div', 'list');
      for (const it of sec.items) {
        const row = it.type === 'link' ? el('a', 'item') : el('button', 'item');
        if (it.type === 'link') { row.href = it.url; if (/^https?:/.test(it.url)) { row.target = '_blank'; row.rel = 'noopener'; } }
        else { row.type = 'button'; row.addEventListener('click', () => openItem(it, row)); }
        row.appendChild(el('div', 'ic', it.icon || '•'));
        const tx = el('div', 'tx'); tx.appendChild(el('div', 't', it.title)); if (it.desc) tx.appendChild(el('div', 'd', it.desc));
        row.appendChild(tx);
        row.appendChild(el('div', 'k', it.type === 'page' ? 'Open' : it.type === 'file' ? 'Download' : 'Link'));
        list.appendChild(row);
      }
      s.appendChild(list);
      root.appendChild(s);
    }
  }
  async function openItem(it, row) {
    const tag = row.querySelector('.k'), old = tag.textContent;
    tag.textContent = '…';
    try {
      const bytes = await loadItem(it.id);
      if (it.type === 'page') {
        $('vt').textContent = it.title;
        $('frame').srcdoc = dec.decode(bytes);
        $('viewer').classList.add('open');
        history.pushState({ v: 1 }, '');
      } else {
        const url = URL.createObjectURL(new Blob([bytes], { type: it.mime || 'application/octet-stream' }));
        const a = document.createElement('a'); a.href = url; a.download = it.filename; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
      }
    } catch (e) {
      alert('Could not open that one. Try again.');
    } finally {
      tag.textContent = old;
    }
  }
  function closeViewer() { $('viewer').classList.remove('open'); $('frame').srcdoc = ''; }
  $('back').addEventListener('click', () => { if (history.state && history.state.v) history.back(); else closeViewer(); });
  window.addEventListener('popstate', closeViewer);
  $('lockBtn').addEventListener('click', () => { sessionStorage.removeItem(KEY_STORE); location.reload(); });

  // ---- resume within the same tab ----
  (async () => {
    const saved = sessionStorage.getItem(KEY_STORE);
    if (saved) {
      try {
        key = await crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', false, ['decrypt']);
        manifest = JSON.parse(dec.decode(await decrypt(b64(MANIFEST))));
        openHub(); return;
      } catch (e) { sessionStorage.removeItem(KEY_STORE); key = null; }
    }
    showStep();
  })();
})();
</script>
</body>
</html>
